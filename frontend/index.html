<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Career Premier League</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="login-view" class="view">
    <div class="login-card">
      <h1 id="login-title">Career Premier League</h1>
      <p class="tagline">Season One</p>
      <form id="login-form">
        <label>Username
          <input id="login-username" required autocomplete="username" />
        </label>
        <label>PIN
          <input id="login-pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required autocomplete="current-password" />
        </label>
        <button type="submit">Log in</button>
        <p id="login-error" class="result error" hidden></p>
      </form>
    </div>
  </div>

  <div id="app-view" class="view" hidden>
    <header class="topbar">
      <div class="brand" id="topbar-brand">CPL</div>
      <div class="me">
        <span id="me-name"></span>
        <span id="me-team" class="pill"></span>
        <button id="logout-btn" class="link-btn">Log out</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-panel="wall">Wall</button>
      <button class="tab-btn" data-panel="leaderboard">Leaderboard</button>
      <button class="tab-btn" data-panel="submit">Log Activity</button>
      <button class="tab-btn" data-panel="profile">My Profile</button>
    </nav>

    <main>
      <section id="panel-wall" class="panel"></section>
      <section id="panel-leaderboard" class="panel" hidden></section>
      <section id="panel-submit" class="panel" hidden></section>
      <section id="panel-profile" class="panel" hidden></section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
